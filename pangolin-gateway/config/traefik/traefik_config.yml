providers:
  http:
    endpoint: "http://pangolin:3001/api/v1/traefik-config"
    pollInterval: "5s"
  file:
    filename: "/etc/traefik/dynamic_config.yml"

experimental:
  plugins:
    badger:
      moduleName: "github.com/fosrl/badger"
      version: "v1.4.0"

log:
  level: INFO

accessLog: {}

certificatesResolvers:
  letsencrypt:
    acme:
      # Wildcard certificates require DNS-01. The Cloudflare token is supplied
      # as CF_DNS_API_TOKEN through the Traefik Compose env_file.
      dnsChallenge:
        provider: cloudflare
      email: "admin@alexmickelson.guru"
      storage: "/letsencrypt/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "30m"
    http:
      tls:
        certResolver: "letsencrypt"
        domains:
          - main: "alexmickelson.guru"
            sans:
              - "*.alexmickelson.guru"
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedQuestionMark: true

serversTransport:
  insecureSkipVerify: true

ping:
  entryPoint: "web"
