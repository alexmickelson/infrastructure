name: pangolin

services:
  pangolin:
    image: docker.io/fosrl/pangolin:1.21.0
    container_name: pangolin
    restart: unless-stopped
    env_file:
      - ${PANGOLIN_ENV_FILE:-.env}
    volumes:
      - /data/pangolin:/app/config
      - ./config/config.yml:/app/config/config.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: 10s
      timeout: 10s
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:1.4.3
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - /data/pangolin:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "51820:51820/udp"
      - "21820:21820/udp"

  traefik:
    image: docker.io/library/traefik:v3.7.9
    container_name: pangolin-traefik
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    # Supplies CF_DNS_API_TOKEN for Traefik's Cloudflare DNS-01 challenge.
    env_file:
      - ${PANGOLIN_ENV_FILE:-.env}
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik/traefik_config.yml:/etc/traefik/traefik_config.yml:ro
      - ./config/traefik/dynamic_config.yml:/etc/traefik/dynamic_config.yml:ro
      - /data/pangolin/letsencrypt:/letsencrypt

networks:
  default:
    driver: bridge
    name: pangolin
