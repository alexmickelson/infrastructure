[config]
caching = true
prefer = "saturation"
contrast = 0.5

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "command -v waybar-reload >/dev/null && waybar-reload || true"


[templates.ghostty]
input_path = "~/.config/matugen/templates/ghostty.conf"
output_path = "~/.config/ghostty/colors"
post_hook = "ghostty-reload"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/matugen.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/matugen.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.firefox-chrome]
input_path = "~/.config/matugen/templates/firefox-userChrome.css"
output_path = "~/.cache/matugen/firefox/userChrome.css"
post_hook = "firefox-theme"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim-colorscheme.lua"
output_path = "~/.config/matugen/nvim-colorscheme.lua"

[templates.firefox-content]
input_path = "~/.config/matugen/templates/firefox-userContent.css"
output_path = "~/.cache/matugen/firefox/userContent.css"
post_hook = "firefox-theme"
