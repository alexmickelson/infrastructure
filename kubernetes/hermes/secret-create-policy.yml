apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hermes-secret-create
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
        scope: Namespaced
  matchConditions:
    - name: hermes-service-account
      expression: request.userInfo.username == 'system:serviceaccount:hermes:hermes'
  validations:
    - expression: request.namespace != 'kube-system'
      message: The hermes service account cannot create Secrets in kube-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hermes-secret-create
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: hermes-secret-create
  validationActions: [Deny]
