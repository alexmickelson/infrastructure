apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t3
  namespace: t3
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - t3.alexmickelson.guru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: t3
          port: 3773
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: t3
  namespace: external-dns
spec:
  endpoints:
    - dnsName: t3.alexmickelson.guru
      recordType: CNAME
      targets:
        - igateway.alexmickelson.guru
