apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tsidp-auth
  namespace: tsidp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tsidp-auth
    creationPolicy: Owner
  data:
    - secretKey: authkey
      remoteRef:
        key: tailscale-idp/tsidp
        property: authkey
