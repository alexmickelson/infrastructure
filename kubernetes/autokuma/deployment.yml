apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
  labels:
    app.kubernetes.io/name: autokuma
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: autokuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autokuma
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma:2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTOKUMA__KUMA__URL
              value: http://uptime-kuma.uptimekuma.svc.cluster.local
            - name: AUTOKUMA__KUMA__USERNAME
              value: "@/run/secrets/kuma/username"
            - name: AUTOKUMA__KUMA__PASSWORD
              value: "@/run/secrets/kuma/password"
            - name: AUTOKUMA__STATIC_MONITORS
              value: /monitors
            - name: AUTOKUMA__FILES__ENABLED
              value: "true"
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__KUBERNETES__ENABLED
              value: "false"
            - name: AUTOKUMA__ON_DELETE
              value: delete
            - name: AUTOKUMA__DEFAULT_SETTINGS
              value: |-
                *.max_redirects: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: monitors
              mountPath: /monitors
              readOnly: true
            - name: credentials
              mountPath: /run/secrets/kuma
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: monitors
          configMap:
            name: uptime-kuma-monitors
        - name: credentials
          secret:
            secretName: uptime-kuma-auth
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
