apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-dashboards
  namespace: homeassistant
data:
  home-lights.yaml: |
    views:
      - type: sections
        title: Home
        sections:
          - type: grid
            cards:
              - type: heading
                heading: Bathroom
              - type: tile
                entity: light.bathroom_nightlight
                name: Bathroom Nightlight
                tap_action:
                  action: more-info
                features:
                  - type: light-brightness
                  - type: light-color-temp
                grid_options:
                  columns: 12
              - type: entities
                entities:
                  - type: button
                    name: Red
                    icon: mdi:circle
                    action_name: Set
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      data: {entity_id: light.bathroom_nightlight, hs_color: [0, 100]}
                  - type: button
                    name: Orange
                    icon: mdi:circle
                    action_name: Set
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      data: {entity_id: light.bathroom_nightlight, hs_color: [30, 100]}
                  - type: button
                    name: Yellow
                    icon: mdi:circle
                    action_name: Set
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      data: {entity_id: light.bathroom_nightlight, hs_color: [55, 100]}
