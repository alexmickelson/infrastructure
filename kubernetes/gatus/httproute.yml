apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: istio-ingress
  hostnames:
    - uptime.alexmickelson.guru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: gatus
          port: 80
          weight: 1
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: gatus
  namespace: external-dns
spec:
  endpoints:
    - dnsName: uptime.alexmickelson.guru
      recordType: CNAME
      targets:
        - igateway.alexmickelson.guru
