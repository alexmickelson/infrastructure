apiVersion: v1
kind: ConfigMap
metadata:
  # This must remain `gatus`: the Helm chart references that name through
  # envFrom even when externalConfigMap is set.
  name: gatus
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/data.db
    endpoints:
      - name: Istio main gateway readiness
        group: Infrastructure
        url: http://main-gateway-istio.istio-ingress.svc.cluster.local:15021/healthz/ready
        interval: 30s
        conditions:
          - "[STATUS] == 200"
      - name: Homepage
        group: Public services
        url: https://home.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Forgejo
        group: Public services
        url: https://git.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Nextcloud
        group: Public services
        url: https://next.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Prometheus
        group: Public services
        url: https://prometheus.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Jellyfin
        group: Public services
        url: https://jelly-pub.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Audiobookshelf
        group: Public services
        url: https://audiobook.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Argo CD
        group: Public services
        url: https://argocd.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Copilot API
        group: Public services
        url: https://copilot.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Forgejo (canonical)
        group: Public services
        url: https://forgejo.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Grafana
        group: Public services
        url: https://grafana.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Home Assistant
        group: Public services
        url: https://ha.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Jellyfin (direct)
        group: Public services
        url: https://jellyfin.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Kiali
        group: Public services
        url: https://kiali.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Immich
        group: Public services
        url: https://photos.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: SearXNG
        group: Public services
        url: https://search.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Music Assistant
        group: Public services
        url: https://sound.alexmickelson.guru
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Audiobookshelf (Tailnet)
        group: Private services
        url: https://audiobook.beefalo-newton.ts.net
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Firecrawl (Tailnet)
        group: Private services
        url: https://firecrawl.beefalo-newton.ts.net
