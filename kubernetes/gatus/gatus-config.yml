        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
      - name: Vault (Tailnet)
        group: Private services
        url: https://vault.beefalo-newton.ts.net
        interval: 60s
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] < 400"
