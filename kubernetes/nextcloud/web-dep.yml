apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-web
  namespace: nextcloud
  labels:
    app: nextcloud-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nextcloud-web
  template:
    metadata:
      labels:
        app: nextcloud-web
    spec:
      serviceAccountName: nextcloud-web
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: nextcloud
          image: nextcloud:34@sha256:b97df9e0e1ee3c8c6cc009cb3f12ddce915d624d543b3bb93882025fe323a407
          env:
            - name: TZ
              value: America/Denver
            - name: OVERWRITEPROTOCOL
              value: https
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_HOST
              value: nextcloud-db
          volumeMounts:
            - name: nextcloud-www
              mountPath: /var/www/html
            - name: music
              mountPath: /music
            - name: movies
              mountPath: /movies
            - name: tvshows
              mountPath: /tvshows
            - name: shared
              mountPath: /shared
            - name: audiobooks
              mountPath: /audiobooks
          ports:
            - containerPort: 80
              name: http
      volumes:
        - name: nextcloud-www
          hostPath:
            path: /data/nextcloud/html
            type: DirectoryOrCreate
        - name: music
          hostPath:
            path: /data/media/music
            type: DirectoryOrCreate
        - name: movies
          hostPath:
            path: /data/media/movies
            type: DirectoryOrCreate
        - name: tvshows
          hostPath:
            path: /data/media/tvshows
            type: DirectoryOrCreate
        - name: shared
          hostPath:
            path: /data/media/shared
            type: DirectoryOrCreate
        - name: audiobooks
          hostPath:
            path: /data/media/audiobooks
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-svc
  namespace: nextcloud
  labels:
    app: nextcloud-web
spec:
  selector:
    app: nextcloud-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-web-route
  namespace: nextcloud
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-ingress
    - name: pangolin-gateway
      namespace: istio-ingress
  hostnames:
    - next.alexmickelson.guru
  rules:
    - backendRefs:
        - name: nextcloud-svc
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
