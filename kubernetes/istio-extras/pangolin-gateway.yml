apiVersion: v1
kind: ConfigMap
metadata:
  name: pangolin-gateway-infrastructure
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        metadata:
          annotations:
            proxy.istio.io/config: '{"gatewayTopology":{"numTrustedProxies":1}}'
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pangolin-gateway
  namespace: istio-ingress
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: pangolin-gateway-infrastructure
  gatewayClassName: istio
  listeners:
    - name: pangolin-http
      protocol: HTTP
      port: 80
      hostname: "*.alexmickelson.guru"
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: pangolin-gateway-access-logs
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: pangolin-gateway
  accessLogging:
    - providers:
        - name: envoy
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pangolin-gateway-crowdsec
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: pangolin-gateway
  action: CUSTOM
  provider:
    name: crowdsec
  rules:
    - to:
        - operation:
            ports:
              - "80"
