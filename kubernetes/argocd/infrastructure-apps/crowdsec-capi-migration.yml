apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-capi-credentials-migration
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-capi-credentials-migration
  namespace: crowdsec
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-capi-credentials-migration
  namespace: crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-capi-credentials-migration
subjects:
  - kind: ServiceAccount
    name: crowdsec-capi-credentials-migration
    namespace: crowdsec
---
apiVersion: batch/v1
kind: Job
metadata:
  name: crowdsec-capi-credentials-migration
  namespace: crowdsec
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-capi-credentials-migration
    spec:
      serviceAccountName: crowdsec-capi-credentials-migration
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: alpine/kubectl:1.37.0@sha256:036b8cf863b64e4c4dc0ca34f8b30fa9a151e7ae27631acfd7dccdc8bac85e52
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl -n crowdsec get secret crowdsec-capi-credentials >/dev/null 2>&1; then
                echo "crowdsec-capi-credentials already exists"
                exit 0
              fi

              test -s /source/online_api_credentials.yaml
              kubectl -n crowdsec create secret generic crowdsec-capi-credentials \
                --from-file=online_api_credentials.yaml=/source/online_api_credentials.yaml
          volumeMounts:
            - name: old-config
              mountPath: /source
              readOnly: true
      volumes:
        - name: old-config
          persistentVolumeClaim:
            claimName: crowdsec-config-pvc
