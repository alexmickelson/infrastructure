# Ambient Istio installation for this K3s cluster. This installs the mesh
# components only; no application namespace is enrolled until it receives
# the label `istio.io/dataplane-mode: ambient`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.3
    helm:
      releaseName: istio-base
      values: |
        # Required when Argo CD renders Helm charts with server-side apply.
        base:
          validationFailurePolicy: Fail
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.30.3
    helm:
      releaseName: istio-cni
      values: |
        profile: ambient
        # K3s stores CNI configuration and binaries in nonstandard paths.
        global:
          platform: k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      releaseName: istiod
      values: |
        profile: ambient
        pilot:
          cni:
            enabled: true
        meshConfig:
          extensionProviders:
            - name: crowdsec
              envoyExtAuthzGrpc:
                service: crowdsec-envoy-bouncer.crowdsec.svc.cluster.local
                port: 8080
                # Initial rollout: preserve gateway availability if the bouncer
                # or either CrowdSec API is unavailable.
                failOpen: true
                timeout: 200ms
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.30.3
    helm:
      releaseName: ztunnel
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: main-gateway-infrastructure
  namespace: istio-ingress
data:
  service: |
    metadata:
      annotations:
        tailscale.com/hostname: istio-gateway
    spec:
      type: LoadBalancer
      loadBalancerClass: tailscale
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: istio-ingress
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    external-dns.alpha.kubernetes.io/target: "100.67.217.88"
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: main-gateway-infrastructure
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.alexmickelson.guru"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.alexmickelson.guru"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: alexmickelson-tls-cert
---
# Pangolin terminates public TLS on the VPS and forwards HTTP through Newt to
# the generated ClusterIP Service for this Gateway. Existing HTTPRoutes must
# explicitly add this Gateway to parentRefs before they are reachable here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pangolin-gateway-infrastructure
  namespace: istio-ingress
data:
  deployment: |
    spec:
      template:
        metadata:
          annotations:
            proxy.istio.io/config: '{"gatewayTopology":{"numTrustedProxies":1}}'
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pangolin-gateway
  namespace: istio-ingress
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: pangolin-gateway-infrastructure
  gatewayClassName: istio
  listeners:
    - name: pangolin-http
      protocol: HTTP
      port: 80
      hostname: "*.alexmickelson.guru"
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: main-gateway-access-logs
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: main-gateway
  accessLogging:
    - providers:
        - name: envoy
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: pangolin-gateway-access-logs
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: pangolin-gateway
  accessLogging:
    - providers:
        - name: envoy
---
# CUSTOM makes Envoy synchronously consult the configured CrowdSec ext_authz
# provider for every HTTP(S) request arriving at main-gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: main-gateway-crowdsec
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: main-gateway
  action: CUSTOM
  provider:
    name: crowdsec
  rules:
    - to:
        - operation:
            ports:
              - "80"
              - "443"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pangolin-gateway-crowdsec
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: pangolin-gateway
  action: CUSTOM
  provider:
    name: crowdsec
  rules:
    - to:
        - operation:
            ports:
              - "80"
