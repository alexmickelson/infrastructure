# Uptime Kuma stores monitor state in its database rather than in Helm values.
# The separate AutoKuma application reconciles Git-managed monitor definitions
# into this instance.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://repo.helmforge.dev
    chart: uptime-kuma
    targetRevision: 1.5.9
    helm:
      releaseName: uptime-kuma
      values: |
        fullnameOverride: uptime-kuma

        # Kuma is stateful and must remain a single replica. Its data directory
        # is backed by the explicit hostPath PV below, rather than a dynamically
        # provisioned volume.
        persistence:
          enabled: true
          existingClaim: uptime-kuma-data

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        gatewayAPI:
          enabled: true
          httpRoutes:
            - name: uptime-kuma
              spec:
                parentRefs:
                  - name: main-gateway
                    namespace: istio-ingress
                hostnames:
                  - uptime.alexmickelson.guru
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /

        # The chart renders the host-mounted data volume in this application.
        # AutoKuma's deployment and monitor definitions are managed separately
        # by the directory-backed `autokuma` Argo CD application.
        extraManifests:
          - apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: uptime-kuma-data
            spec:
              capacity:
                storage: 2Gi
              accessModes:
                - ReadWriteOnce
              persistentVolumeReclaimPolicy: Retain
              storageClassName: ""
              volumeMode: Filesystem
              hostPath:
                path: /data/uptimekuma
                type: DirectoryOrCreate
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: uptime-kuma-data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
              storageClassName: ""
              volumeName: uptime-kuma-data
  destination:
    server: https://kubernetes.default.svc
    namespace: uptimekuma
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
