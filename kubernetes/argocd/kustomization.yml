apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          ports:
            - port: 15008
              protocol: TCP
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      - op: add
        path: /data
        value:
          url: https://argocd.alexmickelson.guru
          oidc.config: |
            name: Tailscale
            issuer: https://idp.beefalo-newton.ts.net
            clientID: $argocd-tsidp:client-id
            clientSecret: $argocd-tsidp:client-secret
            requestedScopes: ["openid", "profile", "email"]
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-rbac-cm
    patch: |-
      - op: add
        path: /data
        value:
          policy.default: role:readonly
          policy.csv: |
            g, userid:3931962569565554, role:admin
            g, userid:51839577132867915, role:admin
