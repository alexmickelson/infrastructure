# Prometheus retains data only for the life of its pod.  This is intentional:
# its server data directory is backed by an emptyDir volume, not a PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.17.0
    helm:
      releaseName: prometheus
      values: |
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          # Do not create a PVC: metrics are intentionally temporary.
          persistentVolume:
            enabled: false
          emptyDir:
            sizeLimit: 20Gi
          retention: 7d
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
