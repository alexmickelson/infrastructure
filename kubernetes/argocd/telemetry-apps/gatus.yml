apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://twin.github.io/helm-charts
    chart: gatus
    targetRevision: 1.5.0
    helm:
      releaseName: gatus
      values: |
        persistence:
          enabled: false
        extraVolumeMounts:
          - name: gatus-data
            mountPath: /data
            hostPath: /data/gatus

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

        gateway:
          route:
            enabled: true
            parentRefs:
              - name: main-gateway
                namespace: istio-ingress
            hosts:
              - uptime.alexmickelson.guru

        # The chart uses this ConfigMap both for the config file and envFrom.
        externalConfigMap: gatus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
