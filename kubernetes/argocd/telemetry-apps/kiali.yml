apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: 2.29.0
      helm:
        releaseName: kiali
        values: |
          auth:
            strategy: anonymous
          deployment:
            accessible_namespaces:
              - "**"
          external_services:
            prometheus:
              url: http://prometheus-server.monitoring.svc.cluster.local
          istio_namespace: istio-system
    - repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/kiali
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
    targetRevision: HEAD
    path: kubernetes/kiali-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
