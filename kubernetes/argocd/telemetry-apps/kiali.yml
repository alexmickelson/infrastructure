apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: 2.29.0
      helm:
        releaseName: kiali
        values: |
          auth:
            strategy: openid
            openid:
              client_id: 0e3e2b73e28f0ea806eef0e7ec429254
              issuer_uri: https://idp.beefalo-newton.ts.net
              username_claim: email
              scopes:
                - openid
                - profile
                - email
              disable_rbac: true
          deployment:
            secret_name: kiali-tsidp
            accessible_namespaces:
              - "**"
            network_policy:
              enabled: false
          server:
            web_fqdn: kiali.alexmickelson.guru
          external_services:
            prometheus:
              url: http://prometheus-server.monitoring.svc.cluster.local
          istio_namespace: istio-system
    - repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/kiali
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
    targetRevision: HEAD
    path: kubernetes/kiali-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
