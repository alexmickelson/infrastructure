apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: 12.8.0
      helm:
        releaseName: grafana
        values: |
          persistence:
            enabled: false
          extraVolumeMounts:
            - name: grafana-data
              mountPath: /data/grafana-kube
          grafana.ini:
            paths:
              data: /data/grafana-kube
            server:
              root_url: https://grafana.alexmickelson.guru/
            auth.generic_oauth:
              enabled: true
              name: Tailscale
              allow_sign_up: true
              scopes: openid email profile
              auth_url: https://idp.beefalo-newton.ts.net/authorize
              token_url: https://idp.beefalo-newton.ts.net/token
              api_url: https://idp.beefalo-newton.ts.net/userinfo
              role_attribute_path: "'Viewer'"
              role_attribute_strict: true
              use_pkce: true
          envFromSecret: grafana-tsidp
          env:
            HTTPS_PROXY: http://127.0.0.1:1055
            NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local
          extraContainers: |
            - name: tailnet-egress
              image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
              env:
                - name: TS_USERSPACE
                  value: "true"
                - name: TS_KUBE_SECRET
                  value: ""
                - name: TS_STATE_DIR
                  value: /var/lib/tailscale
                - name: TS_HOSTNAME
                  value: grafana-idp-client
                - name: TS_EXTRA_ARGS
                  value: --advertise-tags=tag:tsidp-client
                - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
                  value: 127.0.0.1:1055
                - name: TS_AUTHKEY
                  valueFrom:
                    secretKeyRef:
                      name: grafana-tailnet
                      key: TS_AUTHKEY
              volumeMounts:
                - name: tailnet-state
                  mountPath: /var/lib/tailscale
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          extraVolumes:
            - name: grafana-data
              hostPath:
                path: /data/grafana-kube
                type: DirectoryOrCreate
            - name: tailnet-state
              emptyDir: {}
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  uid: prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  editable: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
    - repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
