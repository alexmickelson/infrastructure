apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: 12.8.0
      helm:
        releaseName: grafana
        values: |
          persistence:
            enabled: false
          extraVolumeMounts:
            - name: grafana-data
              mountPath: /data/grafana-kube
          grafana.ini:
            paths:
              data: /data/grafana-kube
            server:
              root_url: https://grafana.alexmickelson.guru/
            auth.generic_oauth:
              enabled: true
              name: Tailscale
              allow_sign_up: true
              scopes: openid email profile
              auth_url: https://idp.beefalo-newton.ts.net/authorize
              token_url: https://idp.beefalo-newton.ts.net/token
              api_url: https://idp.beefalo-newton.ts.net/userinfo
              role_attribute_path: "\"'Viewer'\""
              role_attribute_strict: true
              use_pkce: true
          envFromSecret: grafana-tsidp
          extraVolumes:
            - name: grafana-data
              hostPath:
                path: /data/grafana-kube
                type: DirectoryOrCreate
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  uid: prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-server.monitoring.svc.cluster.local
                  isDefault: true
                  editable: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
    - repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
