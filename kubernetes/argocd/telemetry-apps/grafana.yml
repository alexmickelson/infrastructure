apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    # The Grafana-maintained chart is published as an OCI artifact. Argo CD
    # detects the registry from the URL, as it does for Envoy Gateway here.
    repoURL: ghcr.io/grafana-community/helm-charts
    chart: grafana
    targetRevision: 12.8.0
    helm:
      releaseName: grafana
      values: |
        # Grafana creates a random admin password in the grafana secret unless
        # an existing secret is configured later.
        persistence:
          enabled: false
        extraVolumes:
          - name: grafana-data
            hostPath:
              path: /data/grafana-kube
              type: DirectoryOrCreate
        extraVolumeMounts:
          - name: grafana-data
            mountPath: /var/lib/grafana
        # hostPath is created as root on the node.  Initialise it with the UID
        # used by the official Grafana image before Grafana starts.
        extraInitContainers:
          - name: initialise-grafana-data
            image: busybox:1.37.0
            command:
              - sh
              - -ec
              - chown -R 472:472 /var/lib/grafana
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            volumeMounts:
              - name: grafana-data
                mountPath: /var/lib/grafana
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local
                isDefault: true
                editable: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
