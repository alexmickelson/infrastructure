apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: version-checker
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: version-checker
      targetRevision: v0.11.0
      helm:
        releaseName: version-checker
        values: |
          serviceMonitor:
            enabled: false
          versionChecker:
            testAllContainers: true
            imageCacheTimeout: 30m
            logLevel: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
    - repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/version-checker
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
