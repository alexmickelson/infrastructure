apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus-config
  namespace: argocd
  annotations:
    # Make the external ConfigMap available before the Helm release when both
    # Applications are reconciled by a parent application.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://git.alexmickelson.guru/alex/infrastructure.git
    targetRevision: HEAD
    path: kubernetes/gatus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
