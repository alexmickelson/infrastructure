apiVersion: v1
kind: ConfigMap
metadata:
  name: image-outdated
  namespace: monitoring
data:
  outdated.sh: |
    #!/usr/bin/env bash
    # Publishes how many days older the running image is than the newest upstream tag.
    set -uo pipefail
    
    VM=${VM_URL:-http://vmsingle-vmsingle.monitoring.svc.cluster.local:8429}
    WORK=$(mktemp -d)
    trap 'rm -rf "$WORK"' EXIT
    
    series() {
      curl -sS -m 20 -G "$VM/api/v1/query" \
        --data-urlencode 'query=count by (image, current_version, latest_version) (version_checker_is_latest_version)' |
        jq -r '.data.result[]? | "\(.metric.image)\t\(.metric.current_version)\t\(.metric.latest_version)"' | sort -u
    }
    
    registry_token() {
      case "$1" in
        docker.io|index.docker.io)
          curl -sS -m 20 "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$2:pull" | jq -r '.token // empty'
          ;;
        ghcr.io)
          curl -sS -m 20 "https://ghcr.io/token?scope=repository:$2:pull&service=ghcr.io" | jq -r '.token // empty'
          ;;
        quay.io)
          curl -sS -m 20 "https://quay.io/v2/auth?service=quay.io&scope=repository:$2:pull" | jq -r '.token // empty'
          ;;
      esac
    }
    
    registry_host() {
      case "$1" in
        docker.io|index.docker.io) echo registry-1.docker.io ;;
        *) echo "$1" ;;
      esac
    }
    
    manifest_config() {
      local host=$1 repo=$2 ref=$3 tok=$4 m cfg
      m=$(curl -sSL -m 25 -H "Authorization: Bearer $tok" \
        -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
        "https://$host/v2/$repo/manifests/$ref")
      if [ "$(jq -r 'has("manifests")' <<<"$m" 2>/dev/null)" = true ]; then
        cfg=$(curl -sSL -m 25 -H "Authorization: Bearer $tok" \
          -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
          "https://$host/v2/$repo/manifests/$(jq -r '.manifests[0].digest' <<<"$m")" | jq -r '.config.digest // empty')
      else
        cfg=$(jq -r '.config.digest // empty' <<<"$m")
      fi
      [ -n "$cfg" ] && printf '%s\n' "$cfg"
    }
    
    digest_created() {
      local image=$1 digest=$2 rest first registry repo host tok cfg created
      rest=$image
      first=${rest%%/*}
      registry=docker.io
      repo=$rest
      case "$first" in
        *.*|*:*)
          registry=$first
          repo=${rest#*/}
          ;;
        *)
          case "$repo" in
            */*) : ;;
            *) repo=library/$repo ;;
          esac
          ;;
      esac
      host=$(registry_host "$registry")
      tok=$(registry_token "$registry" "$repo")
      [ -n "$tok" ] || return 1
      cfg=$(manifest_config "$host" "$repo" "$digest" "$tok") || return 1
      [ -n "$cfg" ] || return 1
      created=$(curl -sSL -m 25 -H "Authorization: Bearer $tok" "https://$host/v2/$repo/blobs/$cfg" | jq -r '.created // empty')
      [ -n "$created" ] || return 1
      date -u -d "$created" +%s 2>/dev/null
    }
    
    docker_hub() {
      local repo=$1 tag=$2 out
      case "$repo" in
        */*) : ;;
        *) repo=library/$repo ;;
      esac
      out=$(curl -sS -m 20 "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100&name=$tag" |
        jq -r --arg t "$tag" '.results[]? | select(.name==$t) | .tag_last_pushed // empty' | head -1)
      [ -n "$out" ] && date -u -d "$out" +%s
    }
    
    quay() {
      local org=$1 repo=$2 tag=$3 out
      out=$(curl -sS -m 20 "https://quay.io/api/v1/repository/$org/$repo/tag/?specificTag=$tag&limit=1" |
        jq -r '.tags[0].last_modified // empty')
      [ -n "$out" ] && date -u -d "$out" +%s
    }
    
    tag_created() {
      local image=$1 tag=$2 rest first registry repo host tok cfg created
      rest=$image
      first=${rest%%/*}
      registry=docker.io
      repo=$rest
      case "$first" in
        *.*|*:*)
          registry=$first
          repo=${rest#*/}
          ;;
        *)
          case "$repo" in
            */*) : ;;
            *) repo=library/$repo ;;
          esac
          ;;
      esac
      case "$registry" in
        docker.io|index.docker.io) docker_hub "$repo" "$tag" && return 0 ;;
        quay.io) quay "${repo%%/*}" "${repo#*/}" "$tag" && return 0 ;;
      esac
      host=$(registry_host "$registry")
      tok=$(registry_token "$registry" "$repo")
      [ -n "$tok" ] || return 1
      cfg=$(manifest_config "$host" "$repo" "$tag" "$tok") || return 1
      [ -n "$cfg" ] || return 1
      created=$(curl -sSL -m 25 -H "Authorization: Bearer $tok" "https://$host/v2/$repo/blobs/$cfg" | jq -r '.created // empty')
      [ -n "$created" ] || return 1
      date -u -d "$created" +%s 2>/dev/null
    }
    
    plausible() {
      local v=$1
      case "$v" in
        ""|latest|stable|alpine|edge|main|master|sha256:*|unknown) return 1 ;;
      esac
      case "$v" in
        *.*) return 0 ;;
        20[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) return 0 ;;
        [0-9]|[0-9][0-9]) return 0 ;;
      esac
      return 1
    }
    
    : >"$WORK/out"
    while IFS=$'\t' read -r image cur latest; do
      [ -n "$image" ] || continue
      cur_digest=""
      latest_digest=""
      case "$cur" in
        *@sha256:*) cur_digest=${cur#*@} ; cur=${cur%%@*} ;;
        sha256:*) cur_digest=$cur ; cur="" ;;
      esac
      case "$latest" in
        *@sha256:*) latest_digest=${latest#*@} ; latest=${latest%%@*} ;;
        sha256:*) latest_digest=$latest ; latest="" ;;
      esac
      cur_name=${cur:-${cur_digest:0:19}}
      latest_name=${latest:-${latest_digest:0:19}}
      now=$(date -u +%s)
    
      if [ -n "$cur_digest" ] && [ "$cur_digest" = "$latest_digest" ]; then
        days=0
        waiting=0
      elif [ -n "$cur_digest" ] && { ! plausible "$cur" || ! plausible "$latest"; }; then
        cur_ts=$(digest_created "$image" "$cur_digest") || continue
        latest_ts=$(digest_created "$image" "$latest_digest") || continue
        days=$(( (latest_ts - cur_ts) / 86400 ))
        [ "$days" -lt 0 ] && days=0
        waiting=$(( (now - latest_ts) / 86400 ))
        [ "$waiting" -lt 0 ] && waiting=0
      else
        plausible "$cur" || continue
        plausible "$latest" || continue
        if [ "$cur" = "$latest" ]; then
          days=0
          waiting=0
        else
          cur_ts=$(tag_created "$image" "$cur") || continue
          latest_ts=$(tag_created "$image" "$latest") || continue
          days=$(( (latest_ts - cur_ts) / 86400 ))
          [ "$days" -lt 0 ] && days=0
          waiting=$(( (now - latest_ts) / 86400 ))
          [ "$waiting" -lt 0 ] && waiting=0
        fi
      fi
    
      [ "$days" -eq 0 ] && waiting=0
    
      printf 'image_outdated_days{image="%s",current_version="%s",latest_version="%s"} %s\n' \
        "$image" "$cur_name" "$latest_name" "$days" >>"$WORK/out"
      printf 'image_update_waiting_days{image="%s",current_version="%s",latest_version="%s"} %s\n' \
        "$image" "$cur_name" "$latest_name" "$waiting" >>"$WORK/out"
    done < <(series)
    
    cat "$WORK/out"
    if [ "${PUSH:-0}" = 1 ] && [ -s "$WORK/out" ]; then
      curl -sS -m 30 -X POST --data-binary @"$WORK/out" "$VM/api/v1/import/prometheus" >/dev/null
    fi
---
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-outdated
  namespace: monitoring
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: image-outdated
              image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
              command: ["/bin/sh", "-c"]
              args:
                - apk add --no-cache bash curl jq >/dev/null && bash /scripts/outdated.sh
              env:
                - name: PUSH
                  value: "1"
                - name: VM_URL
                  value: http://vmsingle-vmsingle.monitoring.svc.cluster.local:8429
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: image-outdated
