apiVersion: v1
kind: Namespace
metadata:
  name: pangolin
---
# Vault KV v2 mount "secret" is configured by vault-backend. Therefore this
# resolves Vault's secret/data/newt path; do not include "secret/" here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newt-auth
  namespace: pangolin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: newt-auth
    creationPolicy: Owner
  data:
    - secretKey: PANGOLIN_ENDPOINT
      remoteRef:
        key: newt
        property: PANGOLIN_ENDPOINT
    - secretKey: NEWT_ID
      remoteRef:
        key: newt
        property: NEWT_ID
    - secretKey: NEWT_SECRET
      remoteRef:
        key: newt
        property: NEWT_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newt
  namespace: pangolin
  labels:
    app.kubernetes.io/name: newt
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: newt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newt
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      initContainers:
        - name: state-permissions
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["sh", "-c", "chown -R 65534:65534 /var/lib/newt"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["CHOWN"]
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: newt-state
              mountPath: /var/lib/newt
      containers:
        - name: newt
          image: docker.io/fosrl/newt:1.15.0@sha256:d69d047c816ca7721eae90d5f3cd3be53b615b3d498678be21488d666538ee5c
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: newt-auth
          env:
            # Newt persists its resolved environment configuration in the
            # host-backed state directory below.
            - name: HOME
              value: /var/lib/newt
            - name: CONFIG_FILE
              value: /var/lib/newt/config.json
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: newt-state
              mountPath: /var/lib/newt
      volumes:
        - name: newt-state
          hostPath:
            path: /data/pangolin/newt
            type: DirectoryOrCreate
