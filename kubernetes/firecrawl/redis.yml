apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-redis
  namespace: firecrawl
  labels:
    app: firecrawl-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firecrawl-redis
  template:
    metadata:
      labels:
        app: firecrawl-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
          ports:
            - containerPort: 6379
          args: ["redis-server", "--bind", "0.0.0.0"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          hostPath:
            path: /data/firecrawl/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-redis
  namespace: firecrawl
spec:
  selector:
    app: firecrawl-redis
  ports:
    - port: 6379
      targetPort: 6379
