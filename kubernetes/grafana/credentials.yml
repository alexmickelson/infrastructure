apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-tailnet
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-tailnet
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: tailscale-idp/grafana
        property: tailscale-authkey
