apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-image-versions
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  image-versions.json: |
    {
      "uid": "image-versions",
      "title": "Image versions",
      "tags": [
        "images",
        "cleanup"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 5,
      "refresh": "5m",
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "image",
            "label": "image",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "definition": "label_values({__name__=~\"image_version_lookup_success|version_checker_is_latest_version\"}, image)",
            "query": {
              "query": "label_values({__name__=~\"image_version_lookup_success|version_checker_is_latest_version\"}, image)",
              "refId": "image"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "hide": 2,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 2,
          "type": "stat",
          "title": "Last successful report",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "time() - max(last_over_time(image_report_last_success_timestamp_seconds[24h]))",
              "legendFormat": "Last successful report",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "text": {
              "valueSize": 30,
              "titleSize": 14
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 7200
                  }
                ]
              },
              "noValue": "n/a"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unknown release dates",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(1 - min by(image) (last_over_time(image_version_lookup_success[2h]) and on(image,current_version,latest_version) (last_over_time(image_report_timestamp_seconds[2h]) == on(image) group_left max by(image) (last_over_time(image_report_timestamp_seconds[2h])))))",
              "legendFormat": "Unknown release dates",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "text": {
              "valueSize": 30,
              "titleSize": 14
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Registry lookup failures (2h)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "count(sum by(image) (increase(version_checker_image_failures_total[2h])) > 0) or (count(version_checker_last_checked) * 0)",
              "legendFormat": "Registry lookup failures (2h)",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "text": {
              "valueSize": 30,
              "titleSize": 14
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  }
                ]
              },
              "noValue": "n/a"
            },
            "overrides": []
          }
        },
        {
          "id": 1,
          "type": "stat",
          "title": "$image",
          "description": "Days the newest update has been available, not the release-to-release age gap. Matching digests are current. n/a means lookup failure, invalid upstream version, or no fresh report within two hours. Only the newest collection per image is displayed. Registry failures are included, not hidden.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "(last_over_time(image_update_waiting_days{image=~\"$image\"}[2h]) and on(image,current_version,latest_version) (last_over_time(image_report_timestamp_seconds{image=~\"$image\"}[2h]) == on(image) group_left max by(image) (last_over_time(image_report_timestamp_seconds{image=~\"$image\"}[2h])))) or on(image) label_replace(label_replace(label_replace(max by (image, current_version, latest_version) (version_checker_is_latest_version{image=~\"$image\"}) * 0 - 1, \"current_version\", \"$1\", \"current_version\", \"([^@]+)@.*\"), \"latest_version\", \"$1\", \"latest_version\", \"([^@]+)@.*\"), \"current_version\", \"digest\", \"current_version\", \"sha256:.*\")",
              "legendFormat": "{{current_version}} \u2192 {{latest_version}}",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "text": {
              "valueSize": 30,
              "titleSize": 14
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "index": 0,
                      "text": "n/a",
                      "color": "orange"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "#7f1d1d",
                    "value": 7,
                    "gt": true
                  }
                ]
              },
              "noValue": "n/a"
            },
            "overrides": []
          },
          "repeat": "image",
          "repeatDirection": "h",
          "maxPerRow": 4
        }
      ]
    }
