apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-image-versions
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  image-versions.json: |
    {
      "uid": "image-versions",
      "title": "Image versions",
      "tags": [
        "images",
        "cleanup"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "5m",
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "image",
            "label": "image",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "definition": "label_values(version_checker_is_latest_version, image)",
            "query": {
              "query": "label_values(version_checker_is_latest_version, image)",
              "refId": "image"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "hide": 2,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "$image",
          "description": "How many days the newer release has been available; 0 means the running image already matches it. The card names the running and newest version. Red marks an image that is behind and whose update has been waiting more than a week, and n/a means no registry date could be resolved.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "label_replace(max by (image, current_version, latest_version) (last_over_time(image_update_waiting_days{image=\"$image\"}[6h])) or on(image) label_replace(label_replace(label_replace(max by (image, current_version, latest_version) (version_checker_is_latest_version{image=\"$image\"}) * 0 - 1, \"current_version\", \"$1\", \"current_version\", \"([^@]+)@.*\"), \"latest_version\", \"$1\", \"latest_version\", \"([^@]+)@.*\"), \"current_version\", \"digest\", \"current_version\", \"sha256:.*\"), \"image\", \"$1\", \"image\", \"^[A-Za-z0-9-]+\\\\.[A-Za-z0-9.-]+/(.*)$\")",
              "legendFormat": "{{current_version}} → {{latest_version}}",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": false,
            "text": {
              "valueSize": 30,
              "titleSize": 14
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "index": 0,
                      "text": "n/a"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "#7f1d1d",
                    "value": 7,
                    "gt": true
                  }
                ]
              }
            },
            "overrides": []
          },
          "repeat": "image",
          "repeatDirection": "h",
          "maxPerRow": 4
        }
      ]
    }
