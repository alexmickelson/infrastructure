apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo
  namespace: paseo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: paseo
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo
        property: PASEO_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
