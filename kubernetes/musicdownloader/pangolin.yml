apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: musicdownloader-pangolin-route
  namespace: musicdownloader
spec:
  parentRefs:
    - name: pangolin-gateway
      namespace: istio-ingress
  hostnames:
    - musicdl-pub.alexmickelson.guru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: musicdownloader
          port: 3000
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: musicdownloader-pangolin
  namespace: external-dns
spec:
  endpoints:
    - dnsName: musicdl-pub.alexmickelson.guru
      recordType: CNAME
      targets:
        - pangolin.alexmickelson.guru
